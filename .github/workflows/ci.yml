name: CI

# Pull-request quality gate: runs the full verification suite (typecheck, unit
# tests, and the base-path e2e) on every PR to main, and on demand. Branch
# protection on main can require this check before a squash merge.

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
